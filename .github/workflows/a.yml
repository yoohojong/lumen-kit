name: a

on:
  schedule:
    - cron: '15 15 * * *'
    - cron: '15 19 * * *'
    - cron: '15 23 * * *'
    - cron: '15 3 * * *'
    - cron: '15 7 * * *'
    - cron: '15 11 * * *'
  workflow_dispatch:
    inputs:
      slot:
        required: true
        type: choice
        options:
          - '15 15 * * *'
          - '15 19 * * *'
          - '15 23 * * *'
          - '15 3 * * *'
          - '15 7 * * *'
          - '15 11 * * *'

permissions:
  contents: read
  actions: read

concurrency:
  group: a
  cancel-in-progress: false

env:
  SLOT_CRON: ${{ github.event.schedule || inputs.slot }}
  SLOT_WINDOW_HOURS: '2'
  PYTHONIOENCODING: utf-8

jobs:
  claim:
    if: github.run_attempt == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      slot: ${{ steps.c.outputs.slot }}
    steps:
      - uses: actions/checkout@v4
      - id: c
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 slot.py claim a --repo "$GITHUB_REPOSITORY" --workflow a.yml --github-output "$GITHUB_OUTPUT"

  scan:
    needs: claim
    if: needs.claim.outputs.slot != '' && github.run_attempt == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SLOT_OK: ${{ needs.claim.outputs.slot }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: st
          key: st-${{ github.run_id }}
          restore-keys: st-
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python slot.py restore --repo "$GITHUB_REPOSITORY" --name st --dir st --need m.json --seed data/s0
      - id: gate
        run: |
          mkdir -p out
          python pick.py gate --queue data/q.json --first data/f.json --state-dir st \
            --out out/t.json --info out/g.json --github-output "$GITHUB_OUTPUT"
      - if: steps.gate.outputs.go == 'true'
        run: pip install curl_cffi==0.15.0 brotli==1.1.0 beautifulsoup4==4.12.3 lxml==5.3.0
      - id: scan
        if: steps.gate.outputs.go == 'true'
        run: python run.py --targets out/t.json --out out/칸수집.jsonl --max "${{ steps.gate.outputs.limit }}"
      - if: always() && steps.gate.outputs.go == 'true'
        run: |
          touch out/칸수집.jsonl
          python pick.py record --queue data/q.json --first data/f.json --state-dir st --scan out/칸수집.jsonl \
            --summary out/sum.json --gate out/g.json --outcome "${{ steps.scan.outcome }}"
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: st
          key: st-${{ github.run_id }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: st
          path: st/
          retention-days: 90
          if-no-files-found: ignore
      - if: always() && steps.gate.outputs.go == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: r-${{ github.run_id }}
          path: out/
          retention-days: 14
          if-no-files-found: warn
